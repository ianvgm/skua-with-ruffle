using Microsoft.Web.WebView2.Wpf;
using Newtonsoft.Json;
using Newtonsoft.Json.Linq;
using CommunityToolkit.Mvvm.Messaging;
using Skua.Core.Flash;
using Skua.Core.Interfaces;
using Skua.Core.Messaging;
using Skua.Core.Utils;
using System;
using System.Collections.Generic;
using System.Dynamic;
using System.IO;
using System.Linq;
using System.Net.Http;
using System.Web;
using System.Net.WebSockets;
using System.Net.Sockets;
using System.Net;
using System.Text;
using System.Threading;
using System.Threading.Tasks;
using System.Windows;
using System.Windows.Threading;
using System.Xml.Linq;

namespace Skua.WPF.Flash;

/// <summary>
/// IFlashUtil backed by Ruffle (web build) inside WebView2, instead of the Flash ActiveX control.
/// Wire format with skua.swf is unchanged: same XML as ExternalInterface, so Skua.Core is untouched.
/// </summary>
public class RuffleFlashUtil : IFlashUtil
{
    private readonly IMessenger _messenger;
    private readonly Lazy<IScriptManager> _lazyManager;
    private WebView2? _view;
    private TcpWebSocketProxy? _proxy;
    private bool _ready;
    private static readonly object _logLock = new();
    private static readonly string _logPath = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), "Skua", "ruffle-log.txt");

    internal static void Log(string text)
    {
        try
        {
            lock (_logLock)
            {
                Directory.CreateDirectory(Path.GetDirectoryName(_logPath)!);
                File.AppendAllText(_logPath, $"{DateTime.Now:HH:mm:ss.fff} {text}\n");
            }
        }
        catch { }
    }

    public event FlashCallHandler? FlashCall;
    /// <summary>Raised on the UI thread with the control to place in the window.</summary>
    public WebView2? View => _view;

    public RuffleFlashUtil(IMessenger messenger, Lazy<IScriptManager> manager)
    {
        _messenger = messenger;
        _lazyManager = manager;

        // Skua compiles scripts against the assemblies already loaded in the process. The old ActiveX host
        // pulled in WinForms; load it explicitly so scripts that use Form/ProgressBar/Application still compile.
        _ = new Type[]
        {
            typeof(System.Windows.Forms.Form),
            typeof(System.Windows.Forms.ProgressBar),
            typeof(System.Windows.Forms.Application),
            typeof(System.Windows.Forms.DockStyle),
            typeof(System.Windows.Forms.MessageBox),
            typeof(System.Drawing.Size),
            typeof(System.Drawing.Color),
        };
    }

    public void InitializeFlash()
    {
        try { File.WriteAllText(_logPath, ""); } catch { }
        Log("InitializeFlash");
        _view = new WebView2 { DefaultBackgroundColor = System.Drawing.Color.Black };
        _messenger.Send(new RuffleViewChangedMessage(_view));
        _ = InitAsync();
    }

    private async Task InitAsync()
    {
        try
        {
            string dir = AppContext.BaseDirectory;
            // Skua's post-build step moves most files into Assemblies\, so look in both places.
            string host = new[] { Path.Combine(dir, "ruffle-host"), Path.Combine(dir, "Assemblies", "ruffle-host") }
                .FirstOrDefault(Directory.Exists)
                ?? throw new DirectoryNotFoundException("ruffle-host folder not found next to Skua.exe");
            File.Copy(Path.Combine(dir, "skua.swf"), Path.Combine(host, "skua.swf"), true);

            // --disable-web-security: lets Ruffle fetch game.aq.com assets without CORS headers (dev shortcut).
            var env = await CoreWebView2Environment.CreateAsync(null,
                Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData), "Skua", "WebView2"),
                new CoreWebView2EnvironmentOptions("--disable-web-security --autoplay-policy=no-user-gesture-required --disable-features=IsolateOrigins,site-per-process"));
            await _view!.EnsureCoreWebView2Async(env);
            var cw = _view.CoreWebView2;
            cw.Settings.AreDefaultContextMenusEnabled = false;
            cw.Settings.AreDevToolsEnabled = true; // F12 for debugging
            cw.SetVirtualHostNameToFolderMapping("skua.local", host, CoreWebView2HostResourceAccessKind.Allow);
            cw.WebMessageReceived += OnWebMessage;
            cw.NavigationCompleted += (s, a) => Log($"NavigationCompleted success={a.IsSuccess} status={a.WebErrorStatus}");
            cw.ProcessFailed += (s, a) => Log($"ProcessFailed {a.ProcessFailedKind}");
            Log("WebView2 ready, host=" + host);

            _proxy = new TcpWebSocketProxy(); _proxy.Start();
            cw.Navigate("https://skua.local/index.html");
        }
        catch (Exception e)
        {
            Log("InitAsync EXCEPTION " + e);
            MessageBox.Show("Failed to start Ruffle/WebView2 (is the WebView2 Runtime installed?)\r\n" + e.Message, "Skua + Ruffle");
            Environment.Exit(0);
        }
    }

    private async void OnWebMessage(object? sender, CoreWebView2WebMessageReceivedEventArgs e)
    {
        string msg = e.TryGetWebMessageAsString();
        if (msg.StartsWith("<log>")) { Log(msg); return; }
        if (!msg.StartsWith("<invoke name=\"packet") && !msg.StartsWith("<invoke name=\"pext")) Log("FROM SWF: " + (msg.Length > 300 ? msg[..300] : msg));
        if (msg == "<ready/>") { await StartGameAsync(); return; }
        try
        {
            XElement el = XElement.Parse(msg);
            string function = el.Attribute("name")!.Value;
            object[] args = el.Elements().Select(x => FromFlashXml(x)).ToArray();
            FlashCall?.Invoke(function, args);
        }
        catch (Exception ex) { Log("OnWebMessage error: " + ex.Message); }
    }

    private async Task StartGameAsync()
    {
        var proxies = new JArray();
        try
        {
            string json;
            try
            {
                // Same client Skua itself uses for this request (User-Agent + headers the server expects).
                json = await HttpClients.GetGHClient().GetStringAsync("http://content.aq.com/game/api/data/servers");
            }
            catch (Exception ex1)
            {
                Log("server list via Skua client FAILED: " + ex1.Message + " -> retrying with plain client");
                using var http = new HttpClient();
                http.DefaultRequestHeaders.UserAgent.ParseAdd("Skua");
                http.DefaultRequestHeaders.Accept.ParseAdd("application/json");
                json = await http.GetStringAsync("http://content.aq.com/game/api/data/servers");
            }
            Log($"server list: {json.Length} chars, starts: {(json.Length > 160 ? json[..160] : json)}");
            var servers = JArray.Parse(json);
            foreach (var s in servers)   // field names (sIP / iPort) must be verified against the live response
            {
                string ip = (string)s["sIP"]!; int port = (int)s["iPort"]!;
                proxies.Add(new JObject
                {
                    ["host"] = ip, ["port"] = port,
                    ["proxyUrl"] = $"ws://127.0.0.1:{_proxy!.Port}/?h={ip}&p={port}"
                });
            }
        }
        catch (Exception ex) { Log("server list FAILED: " + ex.Message); }
        Log("socket proxies: " + proxies.Count);

        var cfg = new JObject { ["socketProxy"] = proxies, ["parameters"] = new JObject() };
        _ready = true;
        await _view!.CoreWebView2.ExecuteScriptAsync($"window.__skuaStart({cfg.ToString(Formatting.None)})");
        Log("__skuaStart sent");
    }

    // ---------- host -> SWF ----------
    public string? Call(string function, params object[] args) => Call<string>(function, args);

    public T? Call<T>(string function, params object[] args)
    {
        try
        {
            object? o = Call(function, typeof(T), args);
            return o is not null ? (T)o : (T)DefaultProvider.GetDefault<T>(typeof(T));
        }
        catch { return (T)DefaultProvider.GetDefault<T>(typeof(T)); }
    }

    public object? Call(string function, Type type, params object[] args)
    {
        if (_lazyManager.Value.ShouldExit && Thread.CurrentThread.Name == "Script Thread")
            _lazyManager.Value.ScriptCts?.Token.ThrowIfCancellationRequested();
        if (!_ready || _view?.CoreWebView2 is null) { Log("Call DROPPED (not ready): " + function); return default; }
        if (function == "loadClient") Log("Call loadClient");
        try
        {
            string argsJson = JsonConvert.SerializeObject(args.Select(a => a is ExpandoObject ? (object)new Dictionary<string, object>((IDictionary<string, object>)a) : a));
            string js = $"window.__skuaCall({JsonConvert.SerializeObject(function)}, {argsJson})";
            var sw = System.Diagnostics.Stopwatch.StartNew();
            string? raw = RunOnUi(js);
            string result = JsonConvert.DeserializeObject<string>(raw ?? "null") ?? "<null/>";
            sw.Stop();
            TraceCall(function, args, result, sw.ElapsedMilliseconds);
            XElement el = XElement.Parse(result);
            return el.FirstNode is null ? default : Convert.ChangeType(el.FirstNode.ToString(), type);
        }
        catch (OperationCanceledException) { throw; }
        catch (Exception e)
        {
            Log($"Call {function} FAILED: {e.Message}");
            _messenger.Send<FlashErrorMessage>(new(e, function, args));
            return default;
        }
    }


    // Diagnostics: log the first results of each function, plus slow calls.
    private readonly Dictionary<string, int> _traceCount = new();
    private int _slowCount;
    private void TraceCall(string function, object[] args, string result, long ms)
    {
        try
        {
            bool first;
            lock (_traceCount)
            {
                _traceCount.TryGetValue(function, out int n);
                first = n < 4;
                _traceCount[function] = n + 1;
            }
            bool slow = ms > 100 && Interlocked.Increment(ref _slowCount) <= 30;
            if (first || slow)
            {
                string a = string.Join(",", args.Select(x => x?.ToString() ?? "null"));
                if (a.Length > 80) a = a[..80];
                string r = result.Length > 120 ? result[..120] : result;
                Log($"CALL {function}({a}) -> {r} [{ms}ms]{(slow ? " SLOW" : "")}");
            }
        }
        catch { }
    }

    private string? RunOnUi(string js)
    {
        Dispatcher d = Application.Current.Dispatcher;
        if (!d.CheckAccess())
            return d.Invoke(() => _view!.CoreWebView2.ExecuteScriptAsync(js)).GetAwaiter().GetResult();

        // Called from the UI thread: pump messages while waiting to avoid a deadlock.
        Task<string> t = _view!.CoreWebView2.ExecuteScriptAsync(js);
        var frame = new DispatcherFrame();
        t.ContinueWith(_ => frame.Continue = false, TaskScheduler.Default);
        Dispatcher.PushFrame(frame);
        return t.GetAwaiter().GetResult();
    }

    public object FromFlashXml(XElement el)
    {
        switch (el.Name.ToString())
        {
            case "number": return int.TryParse(el.Value, out int i) ? i : float.TryParse(el.Value, out float f) ? f : 0;
            case "true": return true;
            case "false": return false;
            case "null": return null!;
            case "array": return el.Elements().Select(e => FromFlashXml(e)).ToArray();
            case "object":
                dynamic d = new ExpandoObject();
                foreach (var e in el.Elements()) ((IDictionary<string, object>)d)[e.Attribute("id")!.Value] = FromFlashXml(e.Elements().First());
                return d;
            default: return el.Value;
        }
    }

    public IFlashObject<T> CreateFlashObject<T>(string path) => new FlashObject<T>(Call<int>("lnkCreate", path), this);

    public void Dispose()
    {
        _ready = false;
        try { _proxy?.Dispose(); } catch { }
        try { _view?.Dispose(); } catch { }
    }
}

public sealed record RuffleViewChangedMessage(WebView2 View);


/// <summary>
/// Ruffle (web) cannot open raw TCP sockets, and AQW's SmartFox connection is raw TCP.
/// This tiny proxy accepts a WebSocket at ws://127.0.0.1:PORT/?h=HOST&amp;p=PORT and pipes bytes to HOST:PORT.
/// </summary>
public sealed class TcpWebSocketProxy : IDisposable
{
    private readonly HttpListener _http = new();
    private readonly CancellationTokenSource _cts = new();
    public int Port { get; }

    public TcpWebSocketProxy()
    {
        var l = new TcpListener(IPAddress.Loopback, 0); l.Start();
        Port = ((IPEndPoint)l.LocalEndpoint).Port; l.Stop();
        _http.Prefixes.Add($"http://127.0.0.1:{Port}/");
    }

    public void Start()
    {
        _http.Start();
        _ = Task.Run(async () =>
        {
            while (!_cts.IsCancellationRequested)
            {
                try
                {
                    var ctx = await _http.GetContextAsync();
                    if (!ctx.Request.IsWebSocketRequest) { ctx.Response.StatusCode = 400; ctx.Response.Close(); continue; }
                    _ = Task.Run(() => Handle(ctx));
                }
                catch { if (_cts.IsCancellationRequested) break; }
            }
        });
    }

    private async Task Handle(HttpListenerContext ctx)
    {
        try
        {
            var q = HttpUtility.ParseQueryString(ctx.Request.Url!.Query);
            string host = q["h"]!; int port = int.Parse(q["p"]!);
            RuffleFlashUtil.Log($"PROXY: websocket request for {host}:{port}");
            var ws = (await ctx.AcceptWebSocketAsync(null)).WebSocket;
            using var tcp = new TcpClient();
            await tcp.ConnectAsync(host, port);
            RuffleFlashUtil.Log($"PROXY: TCP connected to {host}:{port}");
            var ns = tcp.GetStream();
            long sent = 0, recv = 0;

            var up = Task.Run(async () =>      // Ruffle -> server
            {
                var buf = new byte[16384];
                while (ws.State == WebSocketState.Open)
                {
                    var r = await ws.ReceiveAsync(buf.AsMemory(), _cts.Token);
                    if (r.MessageType == WebSocketMessageType.Close) break;
                    await ns.WriteAsync(buf.AsMemory(0, r.Count), _cts.Token);
                    sent += r.Count;
                    if (sent == r.Count) RuffleFlashUtil.Log($"PROXY: first client->server {r.Count} bytes");
                }
            });
            var down = Task.Run(async () =>    // server -> Ruffle
            {
                var buf = new byte[16384];
                int n;
                while ((n = await ns.ReadAsync(buf, _cts.Token)) > 0)
                    await ws.SendAsync(buf.AsMemory(0, n), WebSocketMessageType.Binary, true, _cts.Token);
                    recv += n;
                    if (recv == n) RuffleFlashUtil.Log($"PROXY: first server->client {n} bytes");
            });
            await Task.WhenAny(up, down);
            RuffleFlashUtil.Log($"PROXY: closed {host}:{port} sent={sent} recv={recv}");
            try { await ws.CloseAsync(WebSocketCloseStatus.NormalClosure, "", CancellationToken.None); } catch { }
        }
        catch (Exception ex) { RuffleFlashUtil.Log("PROXY ERROR: " + ex.Message); try { ctx.Response.Abort(); } catch { } }
    }

    public void Dispose() { _cts.Cancel(); try { _http.Close(); } catch { } }
}
