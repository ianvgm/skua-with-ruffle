name: Build Skua (Ruffle)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar skua.swf
        shell: pwsh
        run: |
          if (!(Test-Path prebuilt/skua.swf)) { throw "Falta prebuilt/skua.swf no repositorio." }

      - name: Baixar Ruffle (web) do npm
        shell: pwsh
        run: |
          npm pack @ruffle-rs/ruffle@0.7.1
          New-Item -ItemType Directory -Force ruffle-host/ruffle | Out-Null
          tar -xzf ruffle-rs-ruffle-0.7.1.tgz -C ruffle-host/ruffle --strip-components=1 --exclude=*.map
          Get-ChildItem ruffle-host/ruffle | Select-Object Name, Length

      - name: Criar arquivos do Ruffle (index.html e GameContainer)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ruffle-host | Out-Null
          $content = @'
          <!doctype html>
          <html><head><meta charset="utf-8">
          <style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#game{width:100%;height:100%}</style>
          <script>
          // Forward console output and errors to the host log (%LOCALAPPDATA%\Skua\ruffle-log.txt)
          const __post = m => { try { window.chrome.webview.postMessage(m); } catch (e) {} };
          const __esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
          for (const k of ["log","info","warn","error"]) {
            const o = console[k].bind(console);
            console[k] = (...a) => { o(...a); __post("<log>["+k+"] "+__esc(a.map(x=>{try{return typeof x==="string"?x:JSON.stringify(x)}catch(e){return String(x)}}).join(" ")).slice(0,600)+"</log>"); };
          }
          window.addEventListener("error", e => console.error("window.onerror", e.message, e.filename, e.lineno));
          window.addEventListener("unhandledrejection", e => console.error("unhandledrejection", String(e.reason)));
          </script>
          <script src="ruffle/ruffle.js"></script>
          </head><body><div id="game"></div>
          <script>
          // ---- Flash-ActiveX-compatible XML encoding, so the C# side keeps parsing exactly as before ----
          const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
          function toXml(v){
            if (v === null || v === undefined) return "<null/>";
            if (v === true) return "<true/>";
            if (v === false) return "<false/>";
            if (typeof v === "number") return "<number>"+v+"</number>";
            if (Array.isArray(v)) return "<array>"+v.map((x,i)=>'<property id="'+i+'">'+toXml(x)+"</property>").join("")+"</array>";
            if (typeof v === "object") return "<object>"+Object.keys(v).map(k=>'<property id="'+esc(k)+'">'+toXml(v[k])+"</property>").join("")+"</object>";
            return "<string>"+esc(v)+"</string>";
          }
          const post = m => window.chrome.webview.postMessage(m);

          // ---- SWF -> host (ExternalInterface.call). Names taken from Skua.AS3 ----
          for (const n of ["loaded","pre-load","packet","pext","packetFromServer","requestLoadGame","debug","openWebsite"]) {
            window[n] = (...a) => { post('<invoke name="'+n+'" returntype="xml"><arguments>'+a.map(toXml).join("")+"</arguments></invoke>"); };
          }

          // ---- host -> SWF (ExternalInterface.addCallback), called by C# via ExecuteScriptAsync ----
          let player;
          window.__skuaCall = (name, args) => {
            try { return toXml(player[name](...args)); }
            catch (e) { console.error("skuaCall", name, e); return "<null/>"; }
          };

          // Called by C# once the WebSocket->TCP proxy is up. cfg = {socketProxy:[{host,port,proxyUrl}], parameters:{}}
          window.__skuaStart = cfg => {
            window.RufflePlayer = window.RufflePlayer || {};
            const ruffle = window.RufflePlayer.newest();
            player = ruffle.createPlayer();
            player.style.width = "100%"; player.style.height = "100%";
            player.config = {
              publicPath: "ruffle/", autoplay: "on", unmuteOverlay: "hidden", splashScreen: false,
              contextMenu: "off", letterbox: "on", allowScriptAccess: true, openUrlMode: "allow",
              socketProxy: cfg.socketProxy, parameters: cfg.parameters || {}, logLevel: "info"
            };
            document.getElementById("game").appendChild(player);
            player.load({ url: "skua.swf" });
          };
          post("<ready/>");
          </script></body></html>
          '@
          Set-Content -Path "ruffle-host/index.html" -Value $content -Encoding UTF8
          $content = @'
          <UserControl
              x:Class="Skua.WPF.UserControls.GameContainerUserControl"
              xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
              xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
              xmlns:d="http://schemas.microsoft.com/expression/blend/2008"
              xmlns:local="clr-namespace:Skua.WPF"
              xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006"
              d:DesignHeight="450"
              d:DesignWidth="800"
              mc:Ignorable="d">
              <Grid>
                  <ProgressBar
                      x:Name="LoadingBar"
                      Width="150"
                      Height="150"
                      IsIndeterminate="True"
                      Style="{StaticResource MaterialDesignCircularProgressBar}" />
                  <!-- Was a WindowsFormsHost; now a plain Border that receives the WebView2 (Ruffle) -->
                  <Border
                      x:Name="gameContainer"
                      Margin="1,0,1,1"
                      Panel.ZIndex="1"
                      Visibility="Visible" />
              </Grid>
          </UserControl>
          '@
          Set-Content -Path "Skua.WPF/UserControls/GameContainerUserControl.xaml" -Value $content -Encoding UTF8
          $content = @'
          using CommunityToolkit.Mvvm.DependencyInjection;
          using CommunityToolkit.Mvvm.Messaging;
          using Skua.Core.Interfaces;
          using Skua.WPF.Flash;
          using System.Windows;
          using System.Windows.Controls;

          namespace Skua.WPF.UserControls;

          public partial class GameContainerUserControl : UserControl
          {
              private IScriptInterface _bot;

              public GameContainerUserControl()
              {
                  InitializeComponent();
                  _bot = Ioc.Default.GetRequiredService<IScriptInterface>();
                  WeakReferenceMessenger.Default.Register<GameContainerUserControl, RuffleViewChangedMessage>(this, (r, m) => r.gameContainer.Child = m.View);
                  Loaded += GameContainer_Loaded;
              }

              private void GameContainer_Loaded(object sender, RoutedEventArgs e)
              {
                  _bot.Flash.FlashCall += LoadingFlash;
                  _bot.Flash.InitializeFlash();
                  Loaded -= GameContainer_Loaded;
              }

              private void LoadingFlash(string function, params object[] args)
              {
                  if (function == "loaded")
                  {
                      LoadingBar.Visibility = Visibility.Hidden;
                      gameContainer.Visibility = Visibility.Visible;
                      _bot.Flash.FlashCall -= LoadingFlash;
                  }
              }
          }
          '@
          Set-Content -Path "Skua.WPF/UserControls/GameContainerUserControl.xaml.cs" -Value $content -Encoding UTF8

      - name: Aplicar patch do Ruffle
        shell: pwsh
        run: |
          # Aplica as 3 edicoes do protótipo Ruffle no codigo do Skua (rodado pelo workflow).
          $ErrorActionPreference = "Stop"

          # 1) DI: usar RuffleFlashUtil
          $cs = "Skua.WPF/Services/ConfigureServices.cs"
          $t = Get-Content $cs -Raw
          if ($t -notmatch "RuffleFlashUtil") {
              $n = $t.Replace("AddSingleton<IFlashUtil, FlashUtil>()", "AddSingleton<IFlashUtil, RuffleFlashUtil>()")
              if ($n -eq $t) { throw "Nao achei AddSingleton<IFlashUtil, FlashUtil>() em $cs" }
              Set-Content $cs $n -NoNewline -Encoding UTF8
          }

          # 2) WebView2 no Skua.WPF
          $p = "Skua.WPF/Skua.WPF.csproj"
          $t = Get-Content $p -Raw
          if ($t -notmatch "Microsoft.Web.WebView2") {
              $add = "  <ItemGroup>`n    <PackageReference Include=`"Microsoft.Web.WebView2`" Version=`"1.0.*`" />`n  </ItemGroup>`n</Project>"
              Set-Content $p $t.Replace("</Project>", $add) -NoNewline -Encoding UTF8
          }

          # 3) copiar ruffle-host junto com o app
          $p = "Skua.App.WPF/Skua.App.WPF.csproj"
          $t = Get-Content $p -Raw
          if ($t -notmatch "ruffle-host") {
              $add = "  <ItemGroup>`n    <None Include=`"..\ruffle-host\**`" Link=`"ruffle-host\%(RecursiveDir)%(Filename)%(Extension)`">`n      <CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory>`n    </None>`n  </ItemGroup>`n</Project>"
              Set-Content $p $t.Replace("</Project>", $add) -NoNewline -Encoding UTF8
          }

          # 4) skua.swf do usuario no lugar esperado pelo build
          New-Item -ItemType Directory -Force "Skua.AS3/skua/bin" | Out-Null
          Copy-Item "prebuilt/skua.swf" "Skua.AS3/skua/bin/skua.swf" -Force
          Write-Host "Patch aplicado."

      - name: Restore
        run: dotnet restore Skua.sln -v:m

      - name: Build source generators
        run: dotnet build Skua.Core.Generators/Skua.Core.Generators.csproj -c Release -p:Platform=AnyCPU -clp:ErrorsOnly

      - name: Build Skua x64
        run: dotnet build Skua.sln -c Release -p:Platform=x64 --no-restore -p:WarningLevel=0 -clp:ErrorsOnly -v:m

      - name: Garantir ruffle-host na saida
        shell: pwsh
        run: |
          Write-Host "== Conteudo de Build/x64 =="
          Get-ChildItem Build/x64 | Select-Object Name
          if (!(Test-Path ruffle-host/index.html)) { throw "ruffle-host/index.html NAO esta no repositorio (suba a pasta ruffle-host do zip)." }
          if (!(Test-Path ruffle-host/ruffle/ruffle.js)) { throw "ruffle.js nao foi baixado do npm." }
          New-Item -ItemType Directory -Force Build/x64/Assemblies | Out-Null
          Copy-Item ruffle-host Build/x64/Assemblies/ruffle-host -Recurse -Force
          Write-Host "== ruffle-host copiado =="
          Get-ChildItem Build/x64/Assemblies/ruffle-host -Recurse -File | Select-Object FullName
          if (!(Test-Path Build/x64/skua.swf)) { Write-Host "AVISO: skua.swf nao esta na raiz de Build/x64" }

      - name: Copiar WebView2Loader.dll para ao lado do Skua.exe
        shell: pwsh
        run: |
          $found = Get-ChildItem Build/x64 -Recurse -Filter WebView2Loader.dll -ErrorAction SilentlyContinue
          $found | Select-Object FullName
          $dll = $found | Where-Object { $_.FullName -match 'win-x64' } | Select-Object -First 1
          if (-not $dll) { $dll = $found | Select-Object -First 1 }
          if (-not $dll) { throw "WebView2Loader.dll nao foi encontrado na saida do build" }
          Copy-Item $dll.FullName Build/x64/WebView2Loader.dll -Force
          Write-Host "Copiado: $($dll.FullName) -> Build/x64/WebView2Loader.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: Skua-Ruffle-x64
          path: Build/x64
